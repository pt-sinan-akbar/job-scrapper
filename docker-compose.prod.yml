services:

  # override: use pre-built image from ghcr.io; host networking gives access to
  # localhost:1080 (reverse SSH proxy tunnel) and localhost:27017 (mongo published port).
  # MONGO_URI must point to localhost (not 'mongo' DNS which is bridge-only).
  # MCP_HOST is the Docker gateway: containers reach it through host.docker.internal,
  # and the public cannot. Do not use 127.0.0.1, it would cut off the UI.
  scraper-mcp:
    image: ${SCRAPER_IMAGE:-job-scraper:latest}
    network_mode: host
    networks: !reset []
    ports: !reset []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${MCP_BIND_HOST:-172.17.0.1}:8080/health"]
    environment:
      - MONGO_URI=${MONGO_URI}
      - MCP_HOST=${MCP_BIND_HOST:-172.17.0.1}

  # override: pre-built image; reached only through caddy, so no published port
  scraper-ui:
    image: ${SCRAPER_IMAGE:-job-scraper:latest}
    network_mode: host
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as r; r.urlopen(r.Request('http://${MCP_BIND_HOST:-172.17.0.1}:8090/health', headers={'Host': 'localhost'}))",
        ]
    environment:
      - UI_ENV=prod
      - UI_HOST=${MCP_BIND_HOST:-172.17.0.1}
      - MONGO_URI=${MONGO_URI}
      - UI_PASSWORD_HASH=${UI_PASSWORD_HASH:-}
      - UI_SESSION_SECRET=${UI_SESSION_SECRET:-}
      - UI_DOMAIN=${UI_DOMAIN:-}
      - FORWARDED_ALLOW_IPS=*

  # SERVICE: caddy — public HTTPS entry for scraper-ui; certificates renew automatically
  caddy:
    image: caddy:2-alpine
    container_name: job-scraper-caddy
    restart: unless-stopped
    profiles: ["ui"]
    depends_on:
      - scraper-ui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - UI_DOMAIN=${UI_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
