name: Build & Deploy scraper

on:
  push:
    branches: [main] # auto-deploy on merge to main
  workflow_dispatch:
    # or trigger manually from GitHub Actions UI

jobs:
  # 1. Build the scraper Docker image and push to ghcr.io
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag_sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: |
          # ghcr.io requires lowercase; github.repository may contain uppercase chars
          REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          # rolling tag — always points to the newest build
          echo "latest=ghcr.io/${REPO_LOWER}:latest" >> "$GITHUB_OUTPUT"
          # immutable tag pinned to this exact commit, used for deployment
          echo "sha=ghcr.io/${REPO_LOWER}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push scraper image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: app
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}

  # 2. SSH into VPS → pull new image → restart MCP (runs after build)
  deploy-mcp:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/scraper

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/scraper"

      - name: Deploy scraper-mcp
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SCRAPER_IMAGE,MONGO_URI,MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,MONGO_DB_NAME,MONGO_COLLECTION_NAME,MCP_BIND_HOST,PROXY_URL,SCRAPER_CONCURRENCY,GHCR_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail
            : "${PROXY_URL:?Set the PROXY_URL GitHub secret or variable}"
            : "${MONGO_URI:?Set the MONGO_URI GitHub secret}"
            : "${GHCR_PULL_TOKEN:?Set the GHCR_PULL_TOKEN GitHub secret}"

            # packages are private; other deploys on this VPS log out, so a saved login is not safe
            trap 'docker logout ghcr.io >/dev/null' EXIT
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            # pull first: a failed pull must not stop the running stack
            (cd ~/scraper && docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile mcp pull)

            # one-time migration: stop stack from pre-rename dir ~/job-scrapper (volume kept)
            if [ -d ~/job-scrapper ]; then
              if [ -f ~/job-scrapper/.env ] && [ ! -f ~/scraper/.env ]; then cp ~/job-scrapper/.env ~/scraper/.env; fi
              docker compose -p job-scrapper down 2>/dev/null || true
            fi

            cd ~/scraper

            # one-time migration: remove legacy docker run container (different name, same port)
            docker rm -f scraper-mcp 2>/dev/null || true

            docker network inspect job-net >/dev/null 2>&1 || docker network create job-net

            C="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $C --profile mcp up -d --no-build
            $C ps
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          SCRAPER_IMAGE: ${{ needs.build.outputs.image_tag_sha }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_ROOT_USER: ${{ vars.MONGO_ROOT_USER || 'admin' }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'job_scraper' }}
          MONGO_COLLECTION_NAME: ${{ vars.MONGO_COLLECTION_NAME || 'scrape_runs' }}
          MCP_BIND_HOST: ${{ vars.MCP_BIND_HOST || '172.17.0.1' }}
          PROXY_URL: ${{ secrets.PROXY_URL || vars.PROXY_URL }}
          SCRAPER_CONCURRENCY: ${{ vars.SCRAPER_CONCURRENCY || '2' }}

  deploy-ui:
    needs: [build, deploy-mcp]
    if: ${{ vars.UI_DOMAIN != '' }} # no domain means no public UI, so skip it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/scraper

      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,Caddyfile"
          target: "~/scraper"

      - name: Deploy scraper-ui
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SCRAPER_IMAGE,MONGO_URI,MONGO_ROOT_USER,MONGO_ROOT_PASSWORD,MONGO_DB_NAME,MONGO_COLLECTION_NAME,PROXY_URL,SCRAPER_CONCURRENCY,UI_PASSWORD_HASH,UI_SESSION_SECRET,UI_DOMAIN,MCP_BIND_HOST,GHCR_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -euo pipefail
            : "${GHCR_PULL_TOKEN:?Set the GHCR_PULL_TOKEN GitHub secret}"
            cd ~/scraper

            trap 'docker logout ghcr.io >/dev/null' EXIT
            printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            C="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $C --profile ui pull
            $C --profile ui up -d --no-build
            $C ps
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          SCRAPER_IMAGE: ${{ needs.build.outputs.image_tag_sha }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_ROOT_USER: ${{ vars.MONGO_ROOT_USER || 'admin' }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'job_scraper' }}
          MONGO_COLLECTION_NAME: ${{ vars.MONGO_COLLECTION_NAME || 'scrape_runs' }}
          PROXY_URL: ${{ secrets.PROXY_URL || vars.PROXY_URL }}
          SCRAPER_CONCURRENCY: ${{ vars.SCRAPER_CONCURRENCY || '2' }}
          UI_PASSWORD_HASH: ${{ secrets.UI_PASSWORD_HASH }}
          UI_SESSION_SECRET: ${{ secrets.UI_SESSION_SECRET }}
          UI_DOMAIN: ${{ vars.UI_DOMAIN }}
          MCP_BIND_HOST: ${{ vars.MCP_BIND_HOST || '172.17.0.1' }}
